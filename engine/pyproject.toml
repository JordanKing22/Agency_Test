[project]
name = "bookedout-engine"
version = "0.1.0"
description = "Outreach engine for the BookedOut HVAC agency: import, enrich, score, personalize, export."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=1.15"]

[project.scripts]
bookedout = "bookedout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookedout*"]

[tool.setuptools.package-data]
bookedout = ["sequences/*.toml"]
